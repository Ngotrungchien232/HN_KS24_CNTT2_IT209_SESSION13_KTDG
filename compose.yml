services:
  mysql:
    image: mysql:8.0
    container_name: campus-hub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: campus_hub
      MYSQL_USER: campususer
      MYSQL_PASSWORD: campuspass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - campus-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: campus-hub-backend:latest
    container_name: campus-hub-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true
      DB_USERNAME: campususer
      DB_PASSWORD: campuspass
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    networks:
      - campus-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql_data:

networks:
  campus-net:
    driver: bridge
